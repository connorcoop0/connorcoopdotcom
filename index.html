<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connor Coop</title>
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://connorcoop.com/" />
    <meta property="og:title" content="Connor Coop" />
    <meta property="og:description" content="Connor Coop — St. Pete, FL" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=IBM+Plex+Mono:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --bg: #05080f;
        --accent: #22d3ee;
        --text: #e2e8f0;
        --dim: #7c8ca8;
        --border: #1e293b;
      }

      html,
      body {
        height: 100%;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: "IBM Plex Mono", monospace;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
        -webkit-font-smoothing: antialiased;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image:
          linear-gradient(var(--border) 1px, transparent 1px),
          linear-gradient(90deg, var(--border) 1px, transparent 1px);
        background-size: 48px 48px;
        opacity: 0.25;
        mask-image: radial-gradient(
          ellipse 80% 80% at 50% 50%,
          black 20%,
          transparent 80%
        );
        pointer-events: none;
        z-index: 0;
      }

      .card {
        position: relative;
        z-index: 1;
        max-width: 480px;
        width: 100%;
        text-align: center;
        animation: fadeUp 0.7s ease forwards;
      }

      .mono {
        font-size: 0.72rem;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .mono::before {
        content: "";
        display: inline-block;
        width: 14px;
        height: 2px;
        background: var(--accent);
        flex-shrink: 0;
      }

      h1 {
        font-family: "Unbounded", sans-serif;
        font-size: clamp(2.8rem, 10vw, 4.5rem);
        font-weight: 900;
        line-height: 1.05;
        letter-spacing: -2px;
        margin-bottom: 6px;
      }

      h1 span {
        color: var(--accent);
      }

      .role {
        font-size: 0.85rem;
        color: var(--dim);
        margin-top: 16px;
        margin-bottom: 40px;
        line-height: 1.6;
      }

      .role strong {
        color: var(--text);
        font-weight: 500;
      }

      .divider {
        width: 100%;
        height: 1px;
        background: var(--border);
        margin-bottom: 32px;
      }

      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: center;
      }

      .link {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 10px 18px;
        background: transparent;
        border: 1px solid var(--border);
        border-radius: 100px;
        color: var(--dim);
        text-decoration: none;
        font-size: 0.78rem;
        letter-spacing: 0.3px;
        transition: all 0.25s;
      }

      .link:hover {
        border-color: var(--accent);
        color: var(--accent);
        transform: translateY(-2px);
      }

      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>

      </p>
      <div class="divider"></div>
      <div class="links">
